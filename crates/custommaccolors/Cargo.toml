[package]
name = "custommaccolors"
description = "Installs and runs the daemon that gives every app a custom accent color"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
colors-core = { path = "../core" }
eris-inject = { git = "https://github.com/Eriskii/ErisMacInjectLib", tag = "v0.1.2" }
libc = "0.2"
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
